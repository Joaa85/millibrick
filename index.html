<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MilliBrick</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E3000B;--yellow:#FFD700;--blue:#006CB7;--dark:#1a1a2e;--card:#fff;--bg:#f0f4ff;--text:#1a1a2e;--muted:#6b7280;--radius:16px;--shadow:0 4px 24px rgba(0,0,0,.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto;overflow-x:hidden;}
.header{background:var(--dark);padding:16px 20px 12px;position:sticky;top:0;z-index:100;}
.logo{font-size:24px;font-weight:900;color:var(--yellow);}
.logo span{color:var(--red);}
.logo-sub{font-size:11px;color:rgba(255,255,255,.4);font-family:'Space Mono',monospace;margin-top:2px;}
.tabs{display:flex;background:var(--dark);padding:0 12px 12px;gap:8px;}
.tab{flex:1;padding:10px 4px;border-radius:12px;border:none;background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:3px;}
.tab .ti{font-size:18px;}
.tab.active{background:var(--yellow);color:var(--dark);}
.main{padding:20px 16px 100px;}
.tab-content{display:none;}
.tab-content.active{display:block;}
.section-title{font-size:21px;font-weight:900;color:var(--dark);margin-bottom:5px;}
.section-sub{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5;}
.tip-box{background:#fff9e6;border-radius:12px;padding:12px 14px;font-size:12px;color:#92400e;font-weight:700;line-height:1.7;margin-bottom:16px;border-left:3px solid var(--yellow);}
.cam-wrap{background:#0d0d1a;border-radius:var(--radius);overflow:hidden;margin-bottom:14px;position:relative;aspect-ratio:4/3;}
#cam-video{width:100%;height:100%;object-fit:cover;display:block;}
.cam-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:rgba(255,255,255,.3);background:#0d0d1a;}
.cam-placeholder .big{font-size:48px;}
.cam-placeholder p{font-size:12px;font-family:'Space Mono',monospace;text-align:center;padding:0 20px;}
.cam-overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;}
.cam-frame{width:60%;height:60%;border:2px solid var(--yellow);border-radius:10px;position:relative;}
.cam-frame::before,.cam-frame::after{content:'';position:absolute;width:18px;height:18px;border-color:var(--yellow);border-style:solid;}
.cam-frame::before{top:-2px;left:-2px;border-width:3px 0 0 3px;border-radius:4px 0 0 0;}
.cam-frame::after{bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 4px 0;}
.scan-pulse{position:absolute;inset:-4px;border-radius:12px;border:2px solid var(--yellow);opacity:0;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.cam-status{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;font-weight:800;color:#fff;font-family:'Space Mono',monospace;text-shadow:0 1px 4px rgba(0,0,0,.9);padding:0 12px;}
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-family:'Nunito',sans-serif;font-weight:800;font-size:15px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn:active{transform:scale(.97);}
